# flags-2-env config — https://github.com/ORESoftware/flags-2-env
#
# This file is the CLI contract. The Rust binary parses it directly on every
# platform, and `--help`, shell completions, env-var names, types, and defaults
# are all rendered from it at runtime — there is no second copy in Rust to
# drift. Adding a `[commands.*]` table here without a matching
# `commands::Command` variant fails `command_set_matches_config`.

[help]
url = "https://github.com/fiducia-cloud/fiducia-cli.rs"
columns = ["options", "env", "type", "default", "description"]

[parse]
stop_at_first_positional = false
allow_unknown = false

[commands.regions]
help = "List the selectable Fiducia regions."

[commands.region]
help = "Probe region health endpoints and select the lowest-latency region."
aliases = ["closest"]

[commands.health]
help = "Report one node's health and status through the Fiducia client."

# Command-scoped: `--url` only means anything under `health`, so it is declared
# inside that command rather than polluting the global flag namespace.
[commands.health.flags.url]
env = "FIDUCIA_NODE_URL"
aliases = ["url"]
short = "u"
type = "string"
help = "Probe this node URL directly instead of resolving one from --regions."

[commands.completion]
help = "Print a shell completion script for this CLI."

[commands.completion.flags.shell]
env = "FIDUCIA_COMPLETION_SHELL"
aliases = ["shell"]
short = "s"
type = "string"
default = "bash"
help = "Shell dialect to emit: bash or zsh."

[flags.regions]
env = "FIDUCIA_REGIONS_FILE"
aliases = ["regions"]
short = "r"
type = "string"
default = "edge-regions.json"
help = "Path to the regions JSON ([{name,url}], as generated by fiducia-infra)."

[flags.samples]
env = "FIDUCIA_SAMPLES"
aliases = ["samples"]
short = "n"
type = "integer"
default = 5
help = "Number of latency probes per region (1 through 100)."

[flags.path]
env = "FIDUCIA_HEALTH_PATH"
aliases = ["path"]
short = "p"
type = "string"
default = "/healthz"
help = "Absolute health path probed on each region endpoint."

[flags.timeout]
env = "FIDUCIA_TIMEOUT_MS"
aliases = ["timeout"]
short = "t"
type = "integer"
default = 2000
help = "Per-probe timeout in milliseconds (1 through 60000)."

[flags.warmup]
env = "FIDUCIA_WARMUP"
aliases = ["warmup"]
short = "w"
type = "integer"
default = 0
help = "Discard the first N probes per region (0 through 100)."

[flags.only]
env = "FIDUCIA_ONLY_REGION"
aliases = ["only"]
short = "o"
type = "string"
help = "Probe only the region with this name (unset means all regions)."

[flags.json]
env = "FIDUCIA_JSON"
aliases = ["json"]
short = "j"
type = "bool"
default = false
true_aliases = ["1", "yes", "on"]
false_aliases = ["0", "no", "off"]
help = "Emit machine-readable JSON instead of the human table."


[flags.fiducia-flags-config]
env = "FIDUCIA_FLAGS_CONFIG"
long = "fiducia-flags-config"
type = "string"
help = "Runtime environment key FIDUCIA_FLAGS_CONFIG."
