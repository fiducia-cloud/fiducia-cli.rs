# flags-2-env config — https://github.com/ORESoftware/flags-2-env
#
# Declares fiducia-cli's flags ONCE. The upstream C-backed `flags2env` client can
# parse argv against this file into an env-var map; fiducia-cli reads those same
# env names, with CLI flags overriding env (the flags-2-env merge rule:
# combined = { ...env, ...parsed_cli }). See README for wiring the FFI client.

[help]
url = "https://github.com/fiducia-cloud/fiducia-cli.rs"
columns = ["options", "env", "type", "description"]

[parse]
stop_at_first_positional = false
allow_unknown = false

[flags.regions]
env = "FIDUCIA_REGIONS_FILE"
aliases = ["regions"]
short = "r"
type = "string"
help = "Path to the regions JSON ([{name,url}], as generated by fiducia-infra)."

[flags.samples]
env = "FIDUCIA_SAMPLES"
aliases = ["samples"]
short = "n"
type = "integer"
help = "Number of latency probes per region."

[flags.path]
env = "FIDUCIA_HEALTH_PATH"
aliases = ["path"]
short = "p"
type = "string"
help = "Health path probed on each region endpoint."

[flags.timeout]
env = "FIDUCIA_TIMEOUT_MS"
aliases = ["timeout"]
short = "t"
type = "integer"
help = "Per-probe timeout in milliseconds; a slower region counts as unreachable."

[flags.warmup]
env = "FIDUCIA_WARMUP"
aliases = ["warmup"]
short = "w"
type = "integer"
help = "Discard the first N probes per region (TCP/TLS handshake warm-up) before measuring."

[flags.only]
env = "FIDUCIA_ONLY_REGION"
aliases = ["only"]
short = "o"
type = "string"
help = "Probe only the region with this name (empty = all regions)."

[flags.json]
env = "FIDUCIA_JSON"
aliases = ["json"]
short = "j"
type = "boolean"
help = "Emit machine-readable JSON instead of the human table."
