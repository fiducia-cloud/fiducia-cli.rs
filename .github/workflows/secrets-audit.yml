name: secrets-audit

# Fail-closed, key-independent check that no plaintext secret can reach this
# repository. CI intentionally installs no age identity and performs no
# decryption. The dedicated audit validates tracked/staged paths, ignore rules,
# SOPS ciphertext/MAC structure, and recipient redundancy directly.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  env-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run key-independent environment audit
        run: bash .github/scripts/key-independent-env-audit.sh
