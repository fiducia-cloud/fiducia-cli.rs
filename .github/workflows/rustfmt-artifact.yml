name: rustfmt artifact

on:
  push:
    branches:
      - rescue/DEN-4134-fleet-20260829/main-2f3e1dc83d59
    paths:
      - .github/workflows/rustfmt-artifact.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the rescue branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the repository Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format the workspace
        run: cargo fmt --all
      - name: Upload only formatted source and tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rustfmt-output
          if-no-files-found: error
          retention-days: 1
          path: |
            src/commands/region.rs
            src/env_map.rs
            src/flags.rs
            src/lib.rs
            tests/cli_contract.rs
            tests/env_map.rs
