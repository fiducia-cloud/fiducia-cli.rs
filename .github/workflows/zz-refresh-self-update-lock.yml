name: temporary self-update lock refresh

on:
  push:
    branches:
      - feat/self-update-command

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/self-update-command
          fetch-depth: 0
          persist-credentials: true
      - name: Refresh Cargo.lock for reviewed self-update runtime
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already current'
            exit 0
          fi
          git config user.name 'ORESoftware'
          git config user.email 'alexander.d.mills@gmail.com'
          git add Cargo.lock
          git commit -m 'build: refresh self-update lockfile'
          git push origin HEAD:feat/self-update-command
