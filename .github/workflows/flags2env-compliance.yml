name: flags2env compliance

on:
  pull_request:
    paths:
      - ".github/fixtures/regions.json"
      - ".github/scripts/flags2env-artifact-smoke.sh"
      - ".github/scripts/flags2env-runtime-smoke.sh"
      - ".github/workflows/flags2env-compliance.yml"
      - ".cli-flags.toml"
      - ".dockerignore"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "src/**"
  push:
    branches: [main]
    paths:
      - ".github/fixtures/regions.json"
      - ".github/scripts/flags2env-artifact-smoke.sh"
      - ".github/scripts/flags2env-runtime-smoke.sh"
      - ".github/workflows/flags2env-compliance.yml"
      - ".cli-flags.toml"
      - ".dockerignore"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flags2env:
    permissions:
      contents: read
    uses: ORESoftware/flags-2-env/.github/workflows/reusable-consumer-compliance.yml@f06dcc8ee672943bcdd8d6c9f26c47ac5cf19f30
    with:
      tooling_ref: 48530ec59759d9ecef5a283f49875de6540d2fab
      # Compliance must audit the same parser revision linked into the CLI.
      # Upgrade Cargo.toml and Cargo.lock atomically before advancing this pin.
      parser_ref: 8c8465561075a8d7ebb58074b3a8087138e97d8f
      kind: cli
      command_name: fiducia
      contract_path: .cli-flags.toml
      rust_manifest_path: Cargo.toml
      cargo_lock_path: Cargo.lock
      runtime_smoke_script: .github/scripts/flags2env-runtime-smoke.sh
      artifact_smoke_script: .github/scripts/flags2env-artifact-smoke.sh
