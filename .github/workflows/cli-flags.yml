# Audits .cli-flags.toml against the pinned flags-2-env submodule on changes.
name: CLI flags

on:
  pull_request:
    paths:
      - ".github/workflows/cli-flags.yml"
      - ".cli-flags.toml"
      - ".gitmodules"
      - "src/cli_config.rs"
      - "vendor/flags-2-env"
      - "scripts/with-flags2env.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cli-flags.yml"
      - ".cli-flags.toml"
      - ".gitmodules"
      - "src/cli_config.rs"
      - "vendor/flags-2-env"
      - "scripts/with-flags2env.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build the pinned generator
        run: make -B -C vendor/flags-2-env cli
      - name: Audit the CLI contract
        run: vendor/flags-2-env/build/flags2env audit .cli-flags.toml
      - name: Check the generated Rust interface
        shell: bash
        run: |
          set -euo pipefail
          diff -u src/cli_config.rs \
            <(vendor/flags-2-env/build/flags2env generate rust .cli-flags.toml --name CliConfig)
