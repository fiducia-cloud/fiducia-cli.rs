name: Update flags2env lockfile (temporary)

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  update-lock:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/den-427-bundled-flags2env' &&
      github.actor == 'ORESoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          path: repo
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fiducia-cloud/fiducia-interfaces
          ref: 2c5c806174e067fbe83ad48b724366323ba390a2
          path: fiducia-interfaces
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95.0'
          components: rustfmt,clippy
      - name: Format source and update the lockfile
        working-directory: repo
        run: |
          cargo update -p flags2env
          cargo fmt --all
      - name: Commit formatted source and lockfile
        working-directory: repo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock src
          if ! git diff --cached --quiet; then
            git commit -m 'build: format and lock bundled flags2env runtime'
            git push origin HEAD:feat/den-427-bundled-flags2env
          fi
      - name: Validate the committed candidate
        working-directory: repo
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
