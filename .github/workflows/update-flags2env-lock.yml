name: Update flags2env lockfile (temporary)

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  update-lock:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/den-427-bundled-flags2env' &&
      github.actor == 'ORESoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          path: repo
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fiducia-cloud/fiducia-interfaces
          ref: 2c5c806174e067fbe83ad48b724366323ba390a2
          path: fiducia-interfaces
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95.0'
          components: rustfmt,clippy
      - name: Capture dependency and format bootstrap
        working-directory: repo
        shell: bash
        run: |
          set +e
          cargo update > .den-427-bootstrap.txt 2>&1
          update_status=$?
          cargo fmt --all >> .den-427-bootstrap.txt 2>&1
          fmt_status=$?
          printf '\nupdate_status=%s\nfmt_status=%s\n' "$update_status" "$fmt_status" >> .den-427-bootstrap.txt
          exit 0
      - name: Commit diagnostic
        working-directory: repo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .den-427-bootstrap.txt Cargo.lock src
          git commit -m 'chore: capture flags2env CLI bootstrap diagnostic'
          git push origin HEAD:feat/den-427-bundled-flags2env
