# CI: workflow lint, cross-platform Rust checks, and cargo-audit.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZED_CLI_REV: dbd63f1d87d12c2e8cb9a8c600fae9b79f94e559

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: repo
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: repo/.github/workflows/ci.yml repo/.github/workflows/cli-flags.yml repo/.github/workflows/flags2env-compliance.yml

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: bd718cd72d72aa330534f3688f8fb1ce90c19d10
          path: fiducia-interfaces
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: repo
      - name: Build audited Zed CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo install \
            --locked \
            --git https://github.com/zed-pkg/zed-cli.git \
            --rev "$ZED_CLI_REV" \
            --root "$RUNNER_TEMP/zed-cli" \
            --bin zed
          echo "$RUNNER_TEMP/zed-cli/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zed-cli/bin/zed" --version
      - name: Install frozen Zed dependencies
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          zed validate --require-lock
          zed install --frozen --install-mode copy
          test -f .vendor/.zed/oresoftware/api-docs/rust/Cargo.toml
      - name: fmt
        if: ${{ matrix.os == 'ubuntu-latest' }}
        working-directory: repo
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: repo
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        working-directory: repo
        run: cargo test --locked --all-targets

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: bd718cd72d72aa330534f3688f8fb1ce90c19d10
          path: fiducia-interfaces
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
      - name: Build audited Zed CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo install \
            --locked \
            --git https://github.com/zed-pkg/zed-cli.git \
            --rev "$ZED_CLI_REV" \
            --root "$RUNNER_TEMP/zed-cli" \
            --bin zed
          echo "$RUNNER_TEMP/zed-cli/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zed-cli/bin/zed" --version
      - name: Install frozen Zed dependencies
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          zed validate --require-lock
          zed install --frozen --install-mode copy
          test -f .vendor/.zed/oresoftware/api-docs/rust/Cargo.toml
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-audit@0.22.2
      - name: audit
        working-directory: repo
        run: cargo audit
