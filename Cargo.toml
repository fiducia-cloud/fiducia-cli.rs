# Cargo manifest for fiducia-cli: builds the `fiducia` binary and its library half.
[package]
name = "fiducia-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line tool for fiducia.cloud — find the closest region, etc."

[lib]
name = "fiducia_cli"
path = "src/lib.rs"

[[bin]]
name = "fiducia"
path = "src/main.rs"

[dependencies]
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Shared API payload/error contract — the CLI decodes node responses
# (KvEntry, LockGrant, ProposeError, …) into these shared types.
fiducia-interfaces = { path = "../fiducia-interfaces/generated/rust" }
# Flags are declared in .cli-flags.toml and converted to environment overrides
# by scripts/with-flags2env.sh using the pinned upstream submodule.
