[package]
org = "fiducia-cloud"
name = "fiducia-cli"
version = "0.1.0"
description = "Command-line tool for fiducia.cloud"
license = "MIT"
keywords = ["cli", "distributed-systems", "locks", "consensus", "rust"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/fiducia-cloud/fiducia-cli.rs"

# Only declare dependencies whose package provenance is intentionally owned by
# Zed. Fiducia sibling crates remain immutable Cargo Git dependencies until
# those repositories are independently packaged, admitted, and published.
[dependencies]
"oresoftware/ores-clis-core" = "^0.1.0"

[build]
command = "cargo build --release --locked --bin fiducia"
outputs = ["target/release/fiducia"]

[bin]
fiducia = "target/release/fiducia"

[install]
adapter = "none"
dir = ".vendor/.zed"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -x \"$ZED_PKG_TEST_TARGET/target/release/fiducia\" && \"$ZED_PKG_TEST_TARGET/target/release/fiducia\" --help >/dev/null"
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", ".vendor/.zed/**", "target/**", "tmp/**", "**/*.log", ".DS_Store"]

[scripts]
test = "cargo test --all-targets --locked"
