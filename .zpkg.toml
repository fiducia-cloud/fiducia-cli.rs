[package]
org = "fiducia"
name = "fiducia-cli"
version = "0.1.0"
description = "Private command-line client for fiducia.cloud coordination services"
license = "UNLICENSED"
keywords = ["cli", "coordination", "locks", "rust", "global-tool"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/fiducia-cloud/fiducia-cli.rs"

[dependencies]
"fiducia/fiducia-interfaces" = "^0.1.0"

[build]
command = "cargo build --release --locked"
outputs = ["target/release/fiducia"]

[bin]
fiducia = "target/release/fiducia"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -x \"$ZED_PKG_TEST_TARGET/target/release/fiducia\" && \"$ZED_PKG_TEST_TARGET/target/release/fiducia\" --help >/dev/null"
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", "target/**", "tmp/**", "**/*.log", ".DS_Store"]

[install]
adapter = "none"

[scripts]
test = "cargo test --all-targets --locked"
